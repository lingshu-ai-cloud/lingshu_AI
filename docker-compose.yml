services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE_PATH:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 8788
      PB_URL: http://pocketbase:8090
      # Historical analysis/backfill stays paused during controlled one-record
      # channel acceptance tests. Manual scheduled-task runs are unaffected.
      CRAWLER_OPS_WORKER_ENABLED: "0"
      PB_VIDEO_BACKFILL_ENABLED: "false"
    volumes:
      - ./data:/app/data
    depends_on:
      pocketbase:
        condition: service_healthy
    expose:
      - "8788"
    ports:
      # The shared Caddy container reaches this bridge-only address. It is not
      # bound to the server's public network interface.
      - "172.17.0.1:${APP_HOST_PORT:-18788}:8788"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8788/api/overseas/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
      args:
        PB_VERSION: ${PB_VERSION:-0.39.5}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE_PATH:-.env.production}
    volumes:
      - pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations:ro
    expose:
      - "8090"
    # PocketBase remains private to the host. The Mac crawl worker reaches it
    # only through an authenticated SSH local-forward tunnel.
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE_PATH:-.env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  pb_data:
    external: true
    # Keep the test environment attached to its original persistent dataset,
    # even when the Compose project name or checkout directory changes.
    name: ${PB_DATA_VOLUME_NAME:-lingshu-ai-cs-preview_preview_pb_data}
  caddy_data:
  caddy_config:
