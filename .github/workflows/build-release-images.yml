name: Build release images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to build (leave empty to build the selected ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-release-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate requested source SHA
        if: github.event_name == 'workflow_dispatch' && inputs.source_sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase 40-character Git commit SHA." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1

      - name: Lock source revision
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ -n "$REQUESTED_SHA" && "$source_sha" != "$REQUESTED_SHA" ]]; then
            echo "Checked out $source_sha instead of requested $REQUESTED_SHA." >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Building immutable source $source_sha"

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "This historical source does not define an npm test script."
            echo "Type-check, production build, and container-level smoke checks remain mandatory."
          fi

      - name: Build application
        run: npm run build

  publish:
    name: Publish ${{ matrix.name }} image
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
          - name: pocketbase
            dockerfile: Dockerfile.pocketbase
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lingshu-ai-${{ matrix.name }}:sha-${{ needs.verify.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.source_sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke-check published image
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/lingshu-ai-${{ matrix.name }}:sha-${{ needs.verify.outputs.source_sha }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          container_name="release-smoke-${IMAGE_NAME}-${GITHUB_RUN_ID}"
          docker rm -f "$container_name" >/dev/null 2>&1 || true
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

          if [[ "$IMAGE_NAME" == "app" ]]; then
            host_port=18788
            container_port=8788
            health_path=/api/overseas/health
          else
            host_port=18090
            container_port=8090
            health_path=/api/health
          fi

          docker pull "$RELEASE_IMAGE"
          docker run --detach \
            --name "$container_name" \
            --publish "127.0.0.1:${host_port}:${container_port}" \
            "$RELEASE_IMAGE" >/dev/null

          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error \
              --max-time 5 \
              "http://127.0.0.1:${host_port}${health_path}" >/dev/null; then
              echo "Published ${IMAGE_NAME} image passed its health check."
              exit 0
            fi
            sleep 5
          done

          docker logs "$container_name" >&2 || true
          echo "Published ${IMAGE_NAME} image failed its health check." >&2
          exit 1

      - name: Record image in job summary
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/lingshu-ai-${{ matrix.name }}:sha-${{ needs.verify.outputs.source_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
