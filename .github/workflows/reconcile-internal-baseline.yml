name: Reconcile internal rollback baseline

on:
  workflow_dispatch:
    inputs:
      current_commit:
        description: Full commit SHA explicitly identified as the currently running internal version
        required: true
        type: string
      current_branch:
        description: GitHub branch corresponding to the running internal version
        required: true
        type: string
      confirmation:
        description: Enter RECONCILE internal
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-internal
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64, internal]
    timeout-minutes: 10
    environment: internal
    steps:
      - name: Require exact internal-only confirmation
        env:
          CURRENT_COMMIT: ${{ inputs.current_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "RECONCILE internal" ]]
          [[ "$CURRENT_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the attested branch resolves to the attested commit
        env:
          CURRENT_COMMIT: ${{ inputs.current_commit }}
          CURRENT_BRANCH: ${{ inputs.current_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${CURRENT_BRANCH}:refs/remotes/origin/${CURRENT_BRANCH}"
          resolved_commit="$(git rev-parse "refs/remotes/origin/${CURRENT_BRANCH}^{commit}")"
          [[ "$resolved_commit" == "$CURRENT_COMMIT" ]] || {
            echo "The named branch no longer resolves to the attested commit." >&2
            exit 1
          }

      - name: Reconcile the running internal images without restarting them
        env:
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          sudo bash deploy/reconcile-existing-release.sh \
            internal \
            lingshu-ai-cs-preview \
            /home/ubuntu/lingshu-ai-cs-preview \
            "${{ inputs.current_commit }}" \
            "${{ inputs.current_branch }}"

      - name: Report signed fail-closed inventory
        env:
          RELEASE_CONSOLE_URL: ${{ secrets.RELEASE_CONSOLE_URL }}
          RELEASE_INVENTORY_WEBHOOK_SECRET: ${{ secrets.RELEASE_INVENTORY_WEBHOOK_SECRET }}
          PUBLIC_SMOKE_URL: https://lingshu.site/api/health
        run: sudo --preserve-env=RELEASE_CONSOLE_URL,RELEASE_INVENTORY_WEBHOOK_SECRET,PUBLIC_SMOKE_URL bash deploy/report-environment-inventory.sh internal
