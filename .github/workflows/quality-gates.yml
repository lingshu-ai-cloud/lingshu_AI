name: quality-gates

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run test:pb-atomic-smoke
      - run: npm run test:pb-upgrade-smoke
      - run: npm run build
      - name: Validate production Compose graph
        env:
          ENV_FILE_PATH: .env.production.example
          PB_DATA_VOLUME_NAME: ci-pocketbase-data
          APP_DATA_VOLUME_NAME: ci-application-data
        run: docker compose --env-file .env.production.example config --quiet
      - name: Build immutable application image
        run: docker build --pull=false --tag lingshu-app:ci .
      - name: Build immutable PocketBase image
        run: docker build --pull=false --file Dockerfile.pocketbase --build-arg PB_VERSION=0.39.9 --tag lingshu-pocketbase:ci .
